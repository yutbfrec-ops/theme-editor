<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業包材報價與成本分析系統</title>
    <style>
        :root { --primary: #2563eb; --danger: #dc2626; --success: #16a34a; --bg: #f8fafc; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); padding: 20px; color: #1e293b; line-height: 1.5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: var(--primary); border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; font-size: 1.25rem; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #e2e8f0; border-radius: 8px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        /* 損耗圖示 */
        #visual-box { width: 100%; height: 60px; background: #e2e8f0; margin: 15px 0; border-radius: 4px; display: flex; overflow: hidden; border: 1px solid #94a3b8; }
        .lane { background: var(--primary); border-right: 1px solid rgba(255,255,255,0.3); height: 100%; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; }
        .waste { background: var(--danger); height: 100%; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; transition: width 0.3s; }
        
        /* 報價結果 */
        .result-card { background: #f1f5f9; padding: 20px; border-radius: 12px; text-align: center; margin-top: 20px; }
        .price-main { font-size: 2.5rem; font-weight: 800; color: var(--primary); margin: 10px 0; }
        .warning { color: var(--danger); font-size: 0.85rem; font-weight: 600; }
        .info { font-size: 0.85rem; color: #64748b; margin-top: 5px; }
        
        /* 滑塊樣式 */
        .slider-container { margin: 15px 0; }
        input[type=range] { height: 8px; background: #cbd5e1; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 包材成本與損耗分析儀</h2>
    
    <div class="section">
        <label>需求規格 (MOP20/AlOx12/LLDPE30)</label>
        <div class="grid">
            <div>
                <label>需求寬度 (mm)</label>
                <input type="number" id="reqWidth" value="214" oninput="calculate()">
            </div>
            <div>
                <label>母卷寬度 (mm)</label>
                <input type="number" id="jumboWidth" value="1000" oninput="calculate()">
            </div>
        </div>
        
        <label style="margin-top:15px;">裁切模擬圖 (藍色可用 / 紅色廢料)</label>
        <div id="visual-box"></div>
        <div id="utilization-text" class="info"></div>
    </div>

    <div class="section">
        <label>國際原油行情 (Brent Crude USD)</label>
        <div class="slider-container">
            <input type="range" id="oilPrice" min="60" max="120" value="85" step="0.5" style="accent-color: #dc2626;" oninput="calculate()">
            <div class="grid" style="margin-top:10px;">
                <span id="oilVal" style="font-weight:bold; color:var(--danger);">Current: $85</span>
                <span style="text-align:right; font-size:0.8rem; color:#64748b;">基準價: $80</span>
            </div>
        </div>
        <div id="oil-impact" class="info"></div>
    </div>

    <div class="section">
        <label>上游材料基準價 (NTD/每平米)</label>
        <input type="number" id="baseM2Price" value="5.5" oninput="calculate()">
        <p class="info">※ 包含 MOP, AlOx, LLDPE 合計成本</p>
    </div>

    <div class="result-card">
        <div class="info">建議最終報價 (含損耗與溢價)</div>
        <div class="price-main" id="finalPrice">NT$ 0.00</div>
        <div id="status-msg" class="warning"></div>
        <div class="info" style="margin-top:10px;">
            此報價為系統基於原油波動與規格損耗之自動推算，有效期 3 天。
        </div>
    </div>
</div>

<script>
    function calculate() {
        // 抓取數值
        const reqWidth = parseFloat(document.getElementById('reqWidth').value) || 0;
        const jumboWidth = parseFloat(document.getElementById('jumboWidth').value) || 1000;
        const oilPrice = parseFloat(document.getElementById('oilPrice').value);
        const baseM2Price = parseFloat(document.getElementById('baseM2Price').value) || 0;
        
        // 1. 損耗計算 (核心：路數與餘料)
        const lanes = Math.floor(jumboWidth / reqWidth);
        const effectiveWidth = lanes * reqWidth;
        const utilization = effectiveWidth / jumboWidth;
        const wastePercent = (1 - utilization) * 100;

        // 2. 更新損耗圖示
        const visualBox = document.getElementById('visual-box');
        visualBox.innerHTML = '';
        for(let i=0; i<lanes; i++) {
            let laneDiv = document.createElement('div');
            laneDiv.className = 'lane';
            laneDiv.style.width = (reqWidth / jumboWidth * 100) + '%';
            laneDiv.innerText = reqWidth;
            visualBox.appendChild(laneDiv);
        }
        let wasteDiv = document.createElement('div');
        wasteDiv.className = 'waste';
        wasteDiv.style.width = (wastePercent) + '%';
        wasteDiv.innerText = '廢料';
        visualBox.appendChild(wasteDiv);
        
        document.getElementById('utilization-text').innerText = `裁切利用率: ${(utilization*100).toFixed(1)}% | 剩餘廢料: ${wastePercent.toFixed(1)}%`;

        // 3. 原油溢價計算 (權重 0.6)
        const baseOil = 80;
        const oilDiff = (oilPrice - baseOil) / baseOil;
        const oilSurchargeFactor = 1 + (oilDiff * 0.6);
        document.getElementById('oilVal').innerText = `當前油價: $${oilPrice}`;
        document.getElementById('oil-impact').innerText = `原油波動影響: ${(oilDiff * 60).toFixed(2)}% (材料成本修正)`;

        // 4. 最終單價計算
        // 公式：(基準價 * 油價修正) / 利用率 * 1.15(利潤與加工)
        const finalM2 = (baseM2Price * oilSurchargeFactor) / utilization;
        const profitMargin = 1.15; // 15% 毛利預留
        const finalPrice = finalM2 * profitMargin;

        // 5. 顯示結果
        document.getElementById('finalPrice').innerText = `NT$ ${finalPrice.toFixed(2)}`;
        
        // 警示語
        const statusMsg = document.getElementById('status-msg');
        if (utilization < 0.85) {
            statusMsg.innerText = "⚠️ 警告：規格損耗過高 (超過 15%)，建議調整寬度以降低單價";
        } else {
            statusMsg.innerText = "✅ 規格利用率良好";
            statusMsg.style.color = "#16a34a";
        }
    }

    // 初始化執行一次
    calculate();
</script>

</body>
</html>
